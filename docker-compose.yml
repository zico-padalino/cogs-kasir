services:
  app:
    build: .
    container_name: cogs-kasir-app
    ports:
      - "${APP_PORT:-8900}:8900"
    volumes:
      - .:/var/www/html
    extra_hosts:
      # Mac/Windows Docker Desktop + Linux: akses MySQL di host (Navicat lokal)
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${APP_PORT:-8900}
      DB_CONNECTION: mysql
      # Jangan pakai service "mysql" — pakai MySQL lokal (Navicat) di Mac
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      # Jangan seed ulang DB lokal yang sudah ada isinya
      SEED_ON_START: "false"
    restart: unless-stopped

  # Opsional: MySQL di dalam Docker (kalau tidak pakai Navicat lokal)
  # Jalankan: docker compose --profile docker-db up -d
  mysql:
    profiles: ["docker-db"]
    image: mysql:8.0
    container_name: cogs-kasir-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: cogs_perhitungan
    volumes:
      - cogs_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  cogs_mysql_data:
